[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataswarm"
version = "0.0.1.beta"
description = "DataSwarm"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "a2ui-agent-sdk==0.2.1",
    "chromadb>=1.5.0,<2",
    "ruamel.yaml>=0.18.0,<0.20",
    "lark-oapi>=1.5.3,<2",
    "loguru>=0.7.3,<0.8",
    "openjiuwen @ git+https://gitcode.com/openJiuwen/agent-core.git@ad0c9dfbbd577423cc60f73edffa0a4699cc53f9",
    # openjiuwen 0.1.17 的文件工具跨 asyncio 任务加锁和解锁，与 filelock 4.x 不兼容。
    # 待上游修复后，验证文件读写和技能读取，再升级或放宽此约束。
    "filelock==3.29.0",
    "pgvector>=0.4.2,<0.5",
    "portalocker>=3.2.0,<4",
    "websockets>=12.0,<16",
    "psutil>=7.2.2,<8",
    "aiosqlite>=0.22.1,<0.23",
    "croniter>=2.0.0,<7",
    "python-telegram-bot>=20.0,<23",
    "discord.py>=2.4.0,<3",
    "slack-bolt>=1.30.0,<2",
    "dingtalk-stream>=0.24.3,<0.25",
    "wecom-aibot-sdk>=1.0.5,<2",
    "python-socks>=2.8.1,<3",
    "greenlet>=3.3.2,<4",
    "skillnet-ai==0.0.16",
    "mutagen>=1.47.0,<2",
    "google-genai>=1.68.0,<2",
    "opentelemetry-api>=1.28.0,<2",
    "opentelemetry-sdk>=1.28.0,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2",
    "sqlite-vec==0.1.6",
    "sqlglot>=30.16.0,<31",  # 结构变更 DDL 分类（struct_change.py）
    "jieba>=0.42,<0.50",  # 指标 EMB 多向量查询的中文分词（metrics/embedding.py 短语抽取）
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.31,<0.1",  # CVE-2026-42561 MultipartParser DoS
    # Transitive dep floors for known CVEs (prevent resolve downgrade)
    "lxml>=6.1.0,<7",  # CVE-2026-41066 XXE
    "pillow>=13.0.0,<14",  # CVE-2026-40192 FITS gzip bomb DoS + 2026-10 批次 40 项（修复版 13.0.0）
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7",
    "httpx[http2,socks]>=0.27,<1.0",
    "certifi>=2024.8.30,<2027",
    "json-repair>=0.30.0,<0.60",
    "gitcode-api>=1.2.20,<2",
    "faiss-cpu>=1.7.0,<2",
    "numpy>=1.24.0,<3",
    "tree-sitter>=0.25.0,<0.26.0",
    "tree-sitter-bash>=0.25.0,<0.26.0",
    "playwright>=1.40,<2",
    "uv>=0.4.0,<0.13",
    # data-insight skill 算子依赖（skill 自带 requirements.txt 同源下限）
    "pandas>=2.2",
    "scipy>=1.11",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0,<3",
    "duckdb>=1.0,<2",
    # excel 数据源（.xlsx 直读；.xls 经 pandas+xlrd 转换后走 read_xlsx）
    "openpyxl>=3.1",
    "xlrd>=2.0",
    # 语义层数据面（dataagent/semantic：GraphBuilder + Neo4jStore；graph-neo4j extra 自带 neo4j 驱动）
    "semantica[graph-neo4j]>=0.7.0,<0.8",
]

[project.optional-dependencies]
# HarmonyOS-compatible reduced dependencies;
# excludes packages with C extensions or system deps unavailable on HarmonyOS.
# Usage: pip install jiuwenswarm --no-deps, then install each dep in this group manually,
# or reference this list in a deployment script / requirements-harmony.txt.
harmony = [
    "a2ui-agent-sdk==0.2.1",
    "ruamel.yaml>=0.18.0",
    "lark-oapi>=1.5.3",
    "loguru>=0.7.3",
    "openjiuwen @ git+https://gitcode.com/openJiuwen/agent-core.git@ad0c9dfbbd577423cc60f73edffa0a4699cc53f9",
    "pgvector>=0.4.2",
    "portalocker>=3.2.0",
    "aiosqlite>=0.22.1",
    "croniter>=2.0.0",
    "python-telegram-bot>=20.0",
    "discord.py>=2.4.0",
    "slack-bolt>=1.30.0",
    "dingtalk-stream>=0.24.3",
    "wecom-aibot-sdk>=1.0.5",
    "python-socks>=2.8.1",
    "greenlet>=3.3.2",
    "skillnet-ai==0.0.16",
    "mutagen>=1.47.0",
    "google-genai>=1.68.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httptools>=0.6.3",
    "python-multipart>=0.0.31",  # CVE-2026-42561
    "lxml>=6.1.0",  # CVE-2026-41066
    "pillow>=13.0.0",  # CVE-2026-40192（2026-10 批次修复版 13.0.0）
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx[socks]>=0.27",
    "json-repair>=0.30.0",
    "gitcode-api>=1.2.20",
]
# 数据源驱动按类型选装，避免默认安装引入额外 SDK 和系统驱动要求。
# SourceTypeAdapter.requires 检测缺失模块并返回 driver_missing:<模块名>；
# 类型是否开放另由 released 控制，安装驱动不能替代实例验收。
# pymysql / sqlalchemy / duckdb / openpyxl 已在核心依赖中，此处不重复声明。
ds-postgres = ["psycopg[binary]>=3.1"]      # 当前连接器使用 psycopg；不承诺纯 Python 替代
ds-sqlserver = ["pyodbc>=5.0"]              # 另需系统 ODBC Driver，故不进 ds-all；本地验收使用 17
ds-mongodb = ["pymongo>=4.6"]
ds-hbase = ["happybase>=1.2"]               # 依赖集群开启 Thrift Server
ds-redis = ["redis>=5.0"]                   # 支持 Hash / Stream / ZSet 采样物化
ds-hdfs = ["requests>=2.31", "fsspec>=2024.2"]  # WebHDFS 走 HTTP；fsspec 2026.x 已无 webhdfs extra，写 extra 会让 uv sync --locked 失败
ds-ftp = ["paramiko>=3.4"]                  # SFTP；纯 FTP 用标准库 ftplib
ds-all = [
    "dataswarm[ds-postgres,ds-mongodb,ds-hbase,ds-redis,ds-hdfs,ds-ftp]",
]

a2a = ["a2a-sdk[http-server]==1.0.0"]
ssh = ["asyncssh>=2.24.0,<2.25"]
desktop = ["pywebview>=5.4,<7"]
dev = ["pyinstaller>=6.0.0", "pywebview>=5.4,<7"]
distribute = ["openjiuwen[postgres,zmq]"]
claude = ["openjiuwen[claude]"]
codex = ["openjiuwen[codex]"]
shell-ast = []
# Same packages as [dependency-groups] test (pip install -e ".[test]")
test = [
    "a2a-sdk[http-server]==1.0.0",
    "asyncssh>=2.24.0,<2.25",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.14.0",
    "pytest-cov>=7.0.0",
    "coverage>=7.7.1",
    "pyyaml>=6.0",
]

[project.scripts]
# 对外标识层 2026-10-24 起 jiuwenswarm* 入口更名为 dataswarm*（模块路径不动，overlay 基线对齐）
# 2026-10-31 起 dataswarm* 入口统一经 dataswarm_boot 引导：默认注入 JIUWENSWARM_DATA_DIR
# (~/.dataswarm) 与端口基准组（与基座同机共存互不抢占）；dwcli/jiuwenbox* 不经引导
dataswarm = "jiuwenswarm.dataswarm_boot:main"
dwcli = "jiuwenswarm.cli.dwcli:main"
dataswarm-app = "jiuwenswarm.dataswarm_boot:app_main"
dataswarm-agentserver = "jiuwenswarm.dataswarm_boot:agentserver_main"
dataswarm-gateway = "jiuwenswarm.dataswarm_boot:gateway_main"
dataswarm-web = "jiuwenswarm.dataswarm_boot:web_main"
dataswarm-start = "jiuwenswarm.dataswarm_boot:start_main"
dataswarm-stop = "jiuwenswarm.dataswarm_boot:stop_main"
dataswarm-init = "jiuwenswarm.dataswarm_boot:init_main"
dataswarm-desktop = "jiuwenswarm.dataswarm_boot:desktop_main"
dataswarm-acp = "jiuwenswarm.dataswarm_boot:acp_main"
dataswarm-acp-chat = "jiuwenswarm.dataswarm_boot:acp_chat_main"
jiuwenbox = "jiuwenbox.cli.jiuwenbox:main"
jiuwenbox-server = "jiuwenbox.server.launcher:main"

[tool.setuptools]
# 入口脚本现在是 jiuwenswarm 包内的一部分，不需要 py-modules
py-modules = []
include-package-data = true
license-files = ["LICENSE", "OPEN_SOURCE_SOFTWARE_NOTICE.md"]
package-dir = {"jiuwenbox" = "jiuwenbox/src/jiuwenbox"}

[tool.setuptools.packages.find]
where = [".", "jiuwenbox/src"]
include = ["jiuwenswarm*", "jiuwenbox*"]
exclude = ["jiuwenswarm.web*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["LICENSE"]
jiuwenswarm = [
    "channels/web/frontend/dist/**/*",
    "channels/web/frontend/dist/*",
    "agents/harness/common/rsi/harness_config.yaml",
    # config / env 模板放在 resources 目录
    "resources/**/*",
    "resources/*",
    "resources/.env.template",
    "symphony/**/*.yaml",
    "symphony/**/*.yml",
    "symphony/**/*.json",
    "symphony/**/*.md",
    "extensions/**/*.yaml",
    "extensions/**/*.yml",
    "extensions/**/*.md",
]
jiuwenbox = [
    "configs/**/*",
    "configs/*",
]

[tool.setuptools.exclude-package-data]
jiuwenswarm = [
    "channels/web/frontend/node_modules/**",
    "channels/web/frontend/node_modules/*",
    "resources/agent/workspace/skills/project-maintainer/**/*",
    "resources/agent/workspace/skills/project-maintainer/*",
]

[tool.uv]
default-groups = ['dev']

[tool.uv.sources]
openjiuwen = { git = "https://gitcode.com/openJiuwen/agent-core.git", rev = "ad0c9dfbbd577423cc60f73edffa0a4699cc53f9" }

[dependency-groups]
# Testing (keep in sync with optional-dependencies.test)
test = [
    "a2a-sdk[http-server]==1.0.0",
    "asyncssh>=2.24.0,<2.25",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.14.0",
    "pytest-cov>=7.0.0",
    "coverage>=7.7.1",
    "pyyaml>=6.0",
]
# Linting & formatting
lint = [
    "ruff>=0.11.2",
    "pylint>=3.0.0",
    "mypy>=1.12.0",
    "codespell>=2.2.4",
    "httpx[socks]>=0.28.1",
]
dev = [{ include-group = "test" }, { include-group = "lint" }]
